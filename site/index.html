<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Job Hunt Command Center</title><meta name="theme-color" content="#11100f"><link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="lockScreen" class="lock-screen">
  <form id="unlockForm" class="lock-card">
    <div class="lock-mark">AN</div>
    <div class="eyebrow">PRIVATE DASHBOARD</div>
    <h1>Job Hunt Command Center</h1>
    <p>Enter the dashboard password. Your job-search data is decrypted locally in this browser.</p>
    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <button class="primary" type="submit" id="unlockBtn">Unlock</button>
    <div id="unlockError" class="lock-error" aria-live="polite"></div>
  </form>
</div>
<div class="app-shell" id="appShell" hidden>
<aside class="sidebar"><div class="brand"><div class="mark">AN</div><div><strong>Job Hunt</strong><span>Command Center</span></div></div>
<nav id="nav">
<button data-view="dashboard" class="active"><span>⌂</span> Dashboard</button>
<button data-view="priority"><span>⚡</span> Priority Queue <b id="priorityBadge"></b></button>
<button data-view="applications"><span>◎</span> Applications</button>
<button data-view="studios"><span>⌘</span> Studio Sweep</button>
<button data-view="activity"><span>↻</span> Activity</button>
</nav>
<div class="side-foot"><button id="exportBtn">Export data</button><div class="sync-mini" id="syncMini"></div></div></aside>
<main><header class="topbar"><div><h1 id="viewTitle">Dashboard</h1><p id="viewSub">The job search, without the LinkedIn blind spots.</p></div><div class="top-actions"><div class="searchbox">⌕ <input id="globalSearch" placeholder="Search roles, companies, studios…"></div><button id="lockBtn" title="Lock dashboard">🔒</button><button id="themeBtn" title="Toggle theme">◐</button></div></header>
<section id="view"></section></main></div>
<dialog id="detailDialog"><form method="dialog" class="dialog-card"><div class="dialog-head"><div><div class="eyebrow" id="detailEyebrow"></div><h2 id="detailTitle"></h2></div><button class="icon-btn" value="cancel">×</button></div><div id="detailBody"></div></form></dialog>
<script src="assets/app.js"></script></body></html>
